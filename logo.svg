<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 450" role="img" aria-label="King of 3D">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.5" stop-color="#f0c14b"/>
      <stop offset="0.56" stop-color="#d9a521"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.56" stop-color="#c4c4cc"/>
      <stop offset="1" stop-color="#9a9aa3"/>
    </linearGradient>
  </defs>

  <!-- Krona -->
  <g transform="translate(140,28) scale(1.6)">
    <path d="M15,74 L15,40 L33,56 L50,22 L67,56 L85,40 L85,74 Z"
          fill="url(#gold)" stroke="#8c6a10" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="12" y="71" width="76" height="12" rx="4" fill="url(#gold)" stroke="#8c6a10" stroke-width="1.5"/>
  </g>

  <!-- KING -->
  <text x="220" y="252" text-anchor="middle"
        font-family="'Arial Black', 'Segoe UI', sans-serif" font-size="104" font-weight="900"
        fill="url(#silver)" letter-spacing="2">KING</text>

  <!-- OF med guldstreck -->
  <line x1="55" y1="286" x2="188" y2="286" stroke="url(#gold)" stroke-width="3"/>
  <text x="220" y="295" text-anchor="middle"
        font-family="'Segoe UI', sans-serif" font-size="26" font-weight="700"
        fill="url(#gold)" letter-spacing="5">OF</text>
  <line x1="252" y1="286" x2="385" y2="286" stroke="url(#gold)" stroke-width="3"/>

  <!-- 3D -->
  <text x="220" y="418" text-anchor="middle"
        font-family="'Arial Black', 'Segoe UI', sans-serif" font-size="122" font-weight="900"
        letter-spacing="2"><tspan fill="url(#silver)">3</tspan><tspan fill="url(#gold)">D</tspan></text>
</svg>
